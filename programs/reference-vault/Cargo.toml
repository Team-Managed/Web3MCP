[package]
name = "reference_vault"
version = "0.1.0"
description = "Reference Anchor SOL vault and Web3MCP config publisher"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "reference_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
solana-sha256-hasher = "2.2.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
