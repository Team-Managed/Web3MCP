name: Reference vault SBF build

on:
  push:
    branches: [main, staging]
    paths:
      - programs/reference-vault/**
      - .github/workflows/reference-vault-build.yml
  pull_request:
    paths:
      - programs/reference-vault/**
      - .github/workflows/reference-vault-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbf-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.4.0
      - name: Install Solana CLI 2.3.0
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.3.0/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Build reference vault with locked dependencies
        working-directory: programs/reference-vault
        run: cargo build-sbf -- --locked
